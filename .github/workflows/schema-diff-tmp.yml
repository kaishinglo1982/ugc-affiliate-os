name: schema-diff-tmp
# TEMPORARY diagnostic (to be deleted before merge): prints the Prisma schema-vs-migrations diff
# as annotations because the Prisma schema engine is not reachable from the authoring environment.
on:
  push:
    branches:
      - fix/ugc-p0-export-auth-migrations
permissions:
  contents: read
env:
  PNPM_VERSION: 11.13.0
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drift"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm run db:migrate:deploy
      - name: Diff migrated database to schema.prisma
        run: |
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script > /tmp/diff.sql || true
          wc -c /tmp/diff.sql
          gzip -9 -c /tmp/diff.sql | base64 -w0 > /tmp/diff.b64
          wc -c /tmp/diff.b64
          python3 - <<'PY'
          data = open('/tmp/diff.b64').read()
          size = 3500
          parts = [data[i:i + size] for i in range(0, len(data), size)]
          for n, part in enumerate(parts, 1):
              print(f"::notice title=schema-diff {n:02d}/{len(parts):02d}::{part}")
          PY
