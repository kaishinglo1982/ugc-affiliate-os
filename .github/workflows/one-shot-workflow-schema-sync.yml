name: One-shot workflow schema sync

on:
  push:
    branches:
      - audit/carryos-tenant-workspace-binding-2026-09-12
    paths:
      - .github/workflows/one-shot-workflow-schema-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/carryos-tenant-workspace-binding-2026-09-12
          fetch-depth: 0
      - name: Synchronize Prisma workflow models with applied Phase 10 migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("prisma/schema.prisma")
          text = path.read_text()

          old_definition = '''model WorkflowDefinition {
            id           String         @id @default(uuid())
            workspaceId  String         @default("00000000-0000-0000-0000-000000000001")
            name         String
            description  String?
            trigger      String         @default("manual")
            scheduleCron String?
            status       WorkflowStatus @default(DRAFT)
            enabled      Boolean        @default(false)
            ownerId      String?
            config       Json?
            createdAt    DateTime       @default(now())
            updatedAt    DateTime       @updatedAt

            steps WorkflowStepDefinition[]
            runs  WorkflowRun[]

            @@index([workspaceId, status])
          }'''
          new_definition = '''model WorkflowDefinition {
            id            String         @id @default(uuid())
            workspaceId   String         @default("00000000-0000-0000-0000-000000000001")
            key           String
            version       Int            @default(1)
            name          String
            description   String?
            trigger       String         @default("manual")
            scheduleCron  String?
            status        WorkflowStatus @default(DRAFT)
            enabled       Boolean        @default(false)
            ownerId       String?
            config        Json?
            definitionHash String?
            activatedAt   DateTime?
            supersededAt  DateTime?
            createdAt     DateTime       @default(now())
            updatedAt     DateTime       @updatedAt

            steps WorkflowStepDefinition[]
            runs  WorkflowRun[]

            @@unique([workspaceId, key, version])
            @@index([workspaceId, status])
            @@index([workspaceId, key, status])
          }'''

          old_step = '''model WorkflowStepDefinition {
            id          String             @id @default(uuid())
            workspaceId String             @default("00000000-0000-0000-0000-000000000001")
            workflowId  String
            workflow    WorkflowDefinition @relation(fields: [workflowId], references: [id], onDelete: Cascade)
            stepOrder   Int
            type        WorkflowStepType
            name        String
            config      Json?

            runs WorkflowStepRun[]

            @@index([workspaceId, workflowId])
          }'''
          new_step = '''model WorkflowStepDefinition {
            id          String             @id @default(uuid())
            workspaceId String             @default("00000000-0000-0000-0000-000000000001")
            workflowId  String
            workflow    WorkflowDefinition @relation(fields: [workflowId], references: [id], onDelete: Cascade)
            key         String
            stepOrder   Int
            type        WorkflowStepType
            name        String
            dependsOn   String[]           @default([])
            config      Json?

            runs WorkflowStepRun[]

            @@unique([workflowId, key])
            @@unique([workflowId, stepOrder])
            @@index([workspaceId, workflowId])
          }'''

          old_run = '''model WorkflowRun {
            id          String            @id @default(uuid())
            workspaceId String            @default("00000000-0000-0000-0000-000000000001")
            workflowId  String
            workflow    WorkflowDefinition @relation(fields: [workflowId], references: [id], onDelete: Cascade)
            triggeredBy String?
            status      WorkflowRunStatus @default(RUNNING)
            context     Json?
            startedAt   DateTime          @default(now())
            finishedAt  DateTime?

            steps WorkflowStepRun[]

            @@index([workspaceId, workflowId, status])
          }'''
          new_run = '''model WorkflowRun {
            id                 String             @id @default(uuid())
            workspaceId        String             @default("00000000-0000-0000-0000-000000000001")
            workflowId         String
            workflow           WorkflowDefinition @relation(fields: [workflowId], references: [id], onDelete: Cascade)
            workflowVersion    Int                @default(1)
            definitionSnapshot Json
            definitionHash     String?
            correlationId      String
            idempotencyKey     String?
            triggeredBy        String?
            status             WorkflowRunStatus  @default(RUNNING)
            context            Json?
            startedAt          DateTime           @default(now())
            finishedAt         DateTime?

            steps WorkflowStepRun[]

            @@index([workspaceId, workflowId, status])
            @@index([workspaceId, correlationId])
          }'''

          for label, old, new in [
              ("WorkflowDefinition", old_definition, new_definition),
              ("WorkflowStepDefinition", old_step, new_step),
              ("WorkflowRun", old_run, new_run),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} block, found {count}")
              text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit synchronized schema
        run: |
          rm .github/workflows/one-shot-workflow-schema-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma .github/workflows/one-shot-workflow-schema-sync.yml
          git diff --cached --check
          git commit -m "fix(prisma): synchronize workflow versioning schema [skip-schema-sync]"
          git push origin HEAD:audit/carryos-tenant-workspace-binding-2026-09-12
