name: Sync UGC Toolchain Lockfile

on:
  pull_request:

permissions:
  contents: write

env:
  PNPM_VERSION: 11.13.1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify supported toolchain
        shell: bash
        run: |
          grep -F 'typescript:' pnpm-lock.yaml >/dev/null
          pnpm exec tsc --version | grep -F 'Version 6.0.3'
          pnpm --version | grep -F '11.13.1'
      - name: Commit lockfile and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-toolchain-lockfile.yml
          git add pnpm-lock.yaml
          git -c core.hooksPath=/dev/null commit --no-verify -m "fix(toolchain): sync TypeScript 6 and pnpm lockfile"
          git -c core.hooksPath=/dev/null push --no-verify origin HEAD:${{ github.event.pull_request.head.ref }}
