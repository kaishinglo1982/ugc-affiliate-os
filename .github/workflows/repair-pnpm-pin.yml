name: Repair pnpm pin

on:
  push:
    branches:
      - fix/pnpm-broken-release-2026-09-17

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pnpm-broken-release-2026-09-17
      - name: Align CI pnpm pin
        shell: bash
        run: |
          sed -i 's/PNPM_VERSION: 9\.15\.4/PNPM_VERSION: 10.30.3/' .github/workflows/ci.yml
          grep 'PNPM_VERSION:' .github/workflows/ci.yml
      - name: Commit CI pin
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/ci.yml; then
            echo 'CI pin already aligned'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'fix(ci): align Actions with pnpm 10.30.3'
          git push origin HEAD:fix/pnpm-broken-release-2026-09-17
