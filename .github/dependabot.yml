version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      testing:
        patterns:
          - vitest
          - "@playwright/test"
          - "@testing-library/*"
    labels:
      - dependencies
      - security
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
      - ci
    commit-message:
      prefix: ci
