# Woodpecker CI — self-hosted, free-as-in-cost CI/CD.
#
# Runs on whatever host you already deploy `deploy/*.service` on. Bypasses
# GitHub Actions' billed minutes entirely (including the March 2026
# self-hosted-runner metering) — this never talks to GitHub Actions at all,
# it's a fully independent CI system that GitHub notifies via webhook and
# that reports back via commit statuses, same as any other check.
#
# Usage:
#   1. cp .env.example .env   (fill in every value — see README.md in this dir)
#   2. docker compose up -d
#   3. open https://<WOODPECKER_HOST>, log in with GitHub, enable the repo
#
# Data (SQLite DB + repo/user state) persists in the `woodpecker-server-data`
# volume. Back it up like you would any other stateful service on this host.

services:
  server:
    image: woodpeckerci/woodpecker-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # put behind your existing reverse proxy / tunnel; do not expose directly
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker
    environment:
      WOODPECKER_OPEN: "false" # only WOODPECKER_ADMIN may log in; no open self-registration
      WOODPECKER_HOST: ${WOODPECKER_HOST}
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}

  agent:
    image: woodpeckerci/woodpecker-agent:latest
    restart: unless-stopped
    command: agent
    depends_on:
      - server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # agent runs pipeline steps as sibling containers
    environment:
      WOODPECKER_SERVER: server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_MAX_WORKFLOWS: "2"

volumes:
  woodpecker-server-data:
